version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: sales-backend
    ports:
      - "7860:7860"
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ./frontend
    container_name: sales-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:7860"
    ports:
      - "8501:8501"
      
